apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "nginx-gitops.fullname" . }}-content
  labels:
    {{- include "nginx-gitops.labels" . | nindent 4 }}
data:
  index.html: |
    <!doctype html>
    <html lang="es">
      <head><meta charset="utf-8"><title>Helm + GitOps</title></head>
      <body style="font-family:Arial,sans-serif;margin:3rem">
        <h1>Aplicación desplegada con Helm</h1>
        <p>Este contenido se administra desde un ConfigMap.</p>
      </body>
    </html>
